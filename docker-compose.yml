services:
  # ── Infrastructure ─────────────────────────────────────────────────────────
  # Note: postgres/redis were used by the old backend (auth/traders/comments).
  # The backend is now on-chain + subgraph only (Keeper + LiveKit), so these
  # are retained solely for graph-node.

  # ── Graph Node (subgraph) ──────────────────────────────────────────────────
  graph-node-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: graph-node
      POSTGRES_DB: graph-node
      PGDATA: /var/lib/postgresql/data
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - gn-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graph-node"]
      interval: 5s
      timeout: 5s
      retries: 5

  graph-node-ipfs:
    image: ipfs/kubo:v0.24.0
    restart: unless-stopped
    ports:
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs-data:/data/ipfs

  graph-node:
    image: graphprotocol/graph-node:v0.35.0
    restart: unless-stopped
    ports:
      - "8000:8000"   # GraphQL HTTP
      - "8020:8020"   # JSON-RPC (admin)
      - "8030:8030"   # Indexing status API
    environment:
      postgres_host: graph-node-postgres
      postgres_user: graph-node
      postgres_pass: graph-node
      postgres_db: graph-node
      ipfs: 'graph-node-ipfs:5001'
      ethereum: 'somnia-testnet:https://dream-rpc.somnia.network'
      GRAPH_LOG: info
      ETHEREUM_BLOCK_BATCH_SIZE: '500'
      GRAPH_ETHEREUM_MAX_BLOCK_RANGE_SIZE: '500'
      GRAPH_ETHEREUM_MAX_EVENT_ONLY_RANGE: '500'
    depends_on:
      graph-node-postgres:
        condition: service_healthy
      graph-node-ipfs:
        condition: service_started

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env.docker

volumes:
  gn-pgdata:
  ipfs-data:
